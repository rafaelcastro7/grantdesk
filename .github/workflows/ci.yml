name: CI

on:
  push:
    branches: [main]
  pull_request:

# Two jobs, split by what each can honestly prove.
#
# `verify` is hermetic: lint, types, unit tests, build. It needs nothing but the
# repo and must stay that way — a gate that depends on the network fails for
# reasons that are not the code's fault, and a gate people learn to re-run is
# not a gate.
#
# `stack` brings up Postgres with pgvector and a local embedder, applies the
# migrations, and runs the things that only mean anything against a real
# database: row-level isolation, ingestion idempotency, the eligibility
# verdicts, and the retrieval eval.
#
# What is deliberately NOT here: the e2e suite and the profile-extraction eval.
# Both call live third-party services — a client's website, a hosted model — and
# neither can distinguish our regression from their outage. They run locally
# against the real stack, which is where their answer means something.

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run verify

  stack:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 15532:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      # The retrieval eval is meaningless without the vector half: without an
      # embedder, hybrid retrieval silently degrades to the very baseline it is
      # being compared against, and the comparison would pass by tautology.
      - name: Install the embedder
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:11434/api/tags > /dev/null && break
            sleep 1
          done
          ollama pull bge-m3

      - name: Bring up the gateway and auth
        run: |
          cp .env.example .env
          docker compose -p grantdesk -f supabase/docker-compose.yml up -d auth rest kong
          for i in $(seq 1 60); do
            curl -sf http://localhost:15535/rest/v1/ > /dev/null && break
            sleep 2
          done

      - run: bun run db:migrate

      - name: Rules and isolation, against a real database
        run: bun run test:integration

      # The number this project is willing to be judged on: does hybrid
      # retrieval beat a keyword scan on our own labelled data? It exits
      # non-zero if it does not.
      - name: Retrieval precision vs the keyword baseline
        run: bun run eval:match

      # Drafting quality, checked against the text rather than by a judge:
      # reuse, word limits, and — the one that matters most — no number in a
      # draft that does not trace back to a fact we supplied.
      - name: Drafting honesty and reuse
        run: bun run eval:drafting
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GOOGLE_AI_STUDIO_KEY: ${{ secrets.GOOGLE_AI_STUDIO_KEY }}
